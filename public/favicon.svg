    <line x1="9" y1="6.5" x2="16" y2="6.5" stroke="#93c5fd" stroke-width="1.8" />
    <line x1="9" y1="10.5" x2="16" y2="10.5" stroke="#93c5fd" stroke-width="1.8" />
  </g>
</svg>
