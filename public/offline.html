<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Awd Course</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0f19" />
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: rgba(17, 24, 39, 0.75);
        --card-border: rgba(255, 255, 255, 0.1);
        --text-primary: #f3f4f6;
        --text-muted: #9ca3af;
        --accent-blue: #3b82f6;
        --accent-blue-hover: #2563eb;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-image: 
          radial-gradient(ellipse 80% 80% at 50% -20%, rgba(59, 130, 246, 0.15), rgba(255, 255, 255, 0)),
          radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.6), rgba(11, 15, 25, 1));
      }

      .offline-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        animation: fadeIn 0.4s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .icon-wrapper {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.05) 100%);
        border: 1px solid rgba(59, 130, 246, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .icon-wrapper svg {
        width: 42px;
        height: 42px;
        color: #60a5fa;
      }

      .badge-offline {
        position: absolute;
        bottom: -6px;
        right: -6px;
        background: #ef4444;
        color: #ffffff;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 0.15rem 0.5rem;
        border-radius: 9999px;
        border: 2px solid var(--bg-color);
        text-transform: uppercase;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }

      p {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .btn-primary {
        background: linear-gradient(to right, #3b82f6, #2563eb);
        color: #ffffff;
        border: none;
        padding: 0.85rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }

      .btn-primary:hover {
        background: linear-gradient(to right, #2563eb, #1d4ed8);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #e5e7eb;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 0.85rem 1.5rem;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }

      .status-note {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #6b7280;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        display: inline-block;
      }

      .status-dot.online {
        background: #10b981;
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="icon-wrapper">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.829-2.829m0 0l2.829-2.829m-2.829 2.829L3 21M8.464 8.464a5 5 0 012.829-1.414M3 3l18 18" />
        </svg>
        <span class="badge-offline">Offline</span>
      </div>

      <h1>Tidak Ada Koneksi Internet</h1>
      <p>
        Aplikasi Awd Course saat ini tidak dapat terhubung ke internet. Anda masih dapat membuka modul atau halaman yang sebelumnya telah tersimpan di cache perangkat Anda.
      </p>

      <div class="actions">
        <button id="retry-btn" class="btn-primary" onclick="retryConnection()">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Coba Sambungkan Lagi</span>
        </button>
        <a href="/" class="btn-secondary">Kembali ke Beranda Cache</a>
      </div>

      <div class="status-note">
        <span class="status-dot" id="live-dot"></span>
        <span id="live-text">Menunggu sinyal jaringan kembali...</span>
      </div>
    </div>

    <script>
      function retryConnection() {
        const spinner = document.getElementById('btn-spinner');
        const btnText = document.getElementById('btn-text');
        spinner.style.display = 'inline-block';
        btnText.innerText = 'Memeriksa...';

        fetch('/', { method: 'HEAD', cache: 'no-store' })
          .then(() => {
            window.location.reload();
          })
          .catch(() => {
            setTimeout(() => {
              spinner.style.display = 'none';
              btnText.innerText = 'Coba Sambungkan Lagi';
            }, 600);
          });
      }

      // Auto reconnect listener
      window.addEventListener('online', () => {
        const dot = document.getElementById('live-dot');
        const liveText = document.getElementById('live-text');
        dot.classList.add('online');
        liveText.innerText = 'Koneksi terdeteksi! Memuat ulang halaman...';
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      });
    </script>
  </body>
</html>
